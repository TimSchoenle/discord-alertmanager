# No query uses the `sqlx::query!` macro yet, so no `.sqlx/` cache exists and nothing reads one.
# The pin is kept so that the first checked query resolves its schema from a committed cache
# rather than from a live database, and so that a build can never silently reach a real one
# because a stale DATABASE_URL was left in the environment.
#
# `force` is deliberately absent (it defaults to false), so an explicit `SQLX_OFFLINE=false` in
# the environment still wins. That is exactly how `cargo xtask db-prepare` generates the caches.
[env]
SQLX_OFFLINE = "true"

[alias]
xtask = "run --quiet --package xtask --"
