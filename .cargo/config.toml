# Every query goes through the `sqlx::query!` macros, and each backend's committed `.sqlx/` cache
# is what they are checked against in an ordinary build. The pin keeps it that way: a build never
# silently reaches a real database because a URL was left in the environment.
#
# `force` is deliberately absent (it defaults to false), so an explicit `SQLX_OFFLINE=false` in
# the environment still wins. That is exactly how `cargo xtask db-prepare` generates the caches.
[env]
SQLX_OFFLINE = "true"

[alias]
xtask = "run --quiet --package xtask --"
