# Codecov configuration. Codecov reads this file from the commit it is processing, so a change
# here takes effect on the pull request that makes it.
#
# Everything above `component_management` is the baseline every repository in the estate carries
# unchanged; the components below are this workspace's own.
#
# Both statuses block: they fail the pull request when coverage falls short. CODEOWNERS sends
# changes to this file through code-owner review, because a pull request could otherwise lower
# its own targets.

codecov:
  require_ci_to_pass: true
  notify:
    wait_for_ci: true
    # One coverage upload per commit, from the `coverage` job in build.yaml. Test results are a
    # separate report type and do not count towards this.
    after_n_builds: 1

coverage:
  precision: 2
  round: down
  range: '60...90'
  status:
    project:
      default:
        target: auto
        threshold: 1%
        if_ci_failed: error
        informational: false
    patch:
      default:
        target: 80%
        # A pull request that changes no measured line, such as a lockfile update, passes rather
        # than reporting 0% of nothing.
        if_not_found: success
        informational: false

comment:
  layout: 'condensed_header, diff, flags, components, condensed_files, condensed_footer'
  behavior: default
  require_changes: 'coverage_drop OR uncovered_patch'

github_checks:
  annotations: false

flag_management:
  default_rules:
    carryforward: true

ignore:
  - '**/fuzz/**'
  - 'xtask/**'
  - '**/benches/**'
  - '**/examples/**'
  - '**/generated/**'

# One component per crate, so a pull request's comment shows which crate its coverage moved in.
component_management:
  individual_components:
    - component_id: binary
      name: discord-alertmanager
      paths: ['crates/discord-alertmanager/**']
    - component_id: am
      name: am
      paths: ['crates/discord-alertmanager-am/**']
    - component_id: config
      name: config
      paths: ['crates/discord-alertmanager-config/**']
    - component_id: core
      name: core
      paths: ['crates/discord-alertmanager-core/**']
    - component_id: discord
      name: discord
      paths: ['crates/discord-alertmanager-discord/**']
    - component_id: engine
      name: engine
      paths: ['crates/discord-alertmanager-engine/**']
    - component_id: ingest
      name: ingest
      paths: ['crates/discord-alertmanager-ingest/**']
    - component_id: runtime
      name: runtime
      paths: ['crates/discord-alertmanager-runtime/**']
    - component_id: store
      name: store
      paths: ['crates/discord-alertmanager-store/**']
    - component_id: store_postgres
      name: store-postgres
      paths: ['crates/discord-alertmanager-store-postgres/**']
    - component_id: store_sqlite
      name: store-sqlite
      paths: ['crates/discord-alertmanager-store-sqlite/**']
