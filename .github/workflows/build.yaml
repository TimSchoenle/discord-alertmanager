name: Build

# Everything a pull request has to pass before it can be merged, plus the same set on every push
# to `main` so that a merge queue skipped nothing.
#
# Three kinds of job live here. The first kind compiles and runs the workspace — `check`, `test`,
# `clippy`, `doc`, `msrv`, and `coverage`, which also uploads to Codecov. The second kind reads a
# committed artefact and regenerates it (`config-docs`, `config-contract` and `query-cache`), so a
# generated file cannot drift from the types or the schema that produce it. The third kind builds the image the release will
# push, on both architectures, and checks that what came out describes the configuration the
# source tree declares.

on:
  push:
    branches: [ "main" ]

  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions: { }

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout the code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Run Check
        uses: TimSchoenle/actions/actions/rust/cargo-check@88e964d440835fd99f7e9d17b4ba1b48544303ba # tag=actions-rust-cargo-check-v1.1.7
        with:
          check_arguments: '--workspace --all-targets --all-features'

  test:
    name: Test
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout the code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      # `discord-alertmanager-store-postgres` starts a throwaway PostgreSQL container rather than
      # taking a service container, so that `cargo test` on a laptop exercises the same backend
      # this job does. The runner image ships a Docker daemon, so nothing here has to arrange one.
      - name: Run Test
        uses: TimSchoenle/actions/actions/rust/test@e16a1e466faf8ec751b26289c1898143a253269f # tag=actions-rust-test-v1.1.2
        with:
          test_arguments: '--workspace --all-features'

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout the code
      checks: write # Required to annotate the commit with clippy warnings
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      # The lint set is `[workspace.lints]` in the root manifest and is inherited by every member.
      # `-D warnings` is what turns those `warn` levels into a gate.
      - name: Run Clippy
        uses: TimSchoenle/actions/actions/rust/clippy@ea4465fbe2bec98efad19b63849f8d1ac67b5c88 # tag=actions-rust-clippy-v1.1.13
        with:
          clippy_arguments: '--workspace --all-targets --all-features -- -D warnings'

  # The `test` set again, instrumented, with the result uploaded to Codecov. It stays beside `test`
  # rather than replacing it, so a Codecov outage fails this job and leaves the test verdict
  # standing. The upload authenticates with this job's OIDC token, so the repository holds no
  # Codecov secret. `.github/codecov.yml` decides what the Codecov statuses check.
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # Required to checkout the code
      id-token: write # Required to authenticate the Codecov upload with OIDC
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Run Coverage
        uses: TimSchoenle/actions/actions/rust/coverage-codecov@9d5cb31939ace7a3d3d7f452052724337c65f153 # tag=actions-rust-coverage-codecov-v2.0.4
        with:
          test_arguments: '--workspace --all-features'
          flags: rust

  # Auto-format comes in two halves. `cargo fmt` runs the toolchain `rust-toolchain.toml` names
  # and reads `rustfmt.toml`, both of which the pull request controls, so the half that runs it
  # holds no secret and a read-only `GITHUB_TOKEN` and hands on only a patch artifact. The second
  # half, in the `ci` environment, mints the maintenance App's token and commits that patch; it
  # runs nothing from the checkout, and `allowed_paths` refuses any path that is not Rust source.
  #
  # Pull requests only: the patch is committed to the pull request's branch, and a push to `main`
  # has none. Code reaches `main` through a pull request that already went through this.
  fmt:
    name: Auto Format
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout the code
    outputs:
      changes_detected: ${{ steps.format.outputs.changes_detected }}
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      # The pull request head, not the default merge commit: the patch is committed to the branch,
      # so it has to be computed against the commit the branch points at.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Auto Format
        id: format
        uses: TimSchoenle/actions/actions/rust/auto-format@495fd50fd4a5ae3d9fb1496c96eada74c6f2529a # tag=actions-rust-auto-format-v2.0.0
        with:
          artifact_name: rust-auto-format

  fmt-commit:
    name: Commit Format
    needs: fmt
    # A fork's pull request gets no secrets, and its branch is not in this repository.
    if: >-
      github.event_name == 'pull_request' &&
      needs.fmt.outputs.changes_detected == 'true' &&
      github.event.pull_request.head.repo.full_name == github.repository
    environment:
      name: ci
      deployment: false
    runs-on: ubuntu-latest
    # Shared with docs.yml rather than with the rest of this workflow: both jobs commit to the
    # pull request branch through the API, which rejects a commit whose parent has moved. Racing
    # them would fail one of the two for a reason its log does not explain, so they queue. Only
    # this half takes the queue: the format job above writes nothing.
    concurrency:
      group: branch-writes-${{ github.event.pull_request.head.repo.full_name || github.repository }}:${{ github.event.pull_request.head.ref || github.ref_name }}
      queue: max
      cancel-in-progress: false
    permissions:
      contents: read # Required to fetch the commit the patch applies to
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      # Only git's objects are needed. Nothing in this checkout is executed.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Generate Bot Token
        id: generate_token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.ACTIONS_MAINTENANCE_APP_ID }}
          private-key: ${{ secrets.ACTIONS_MAINTENANCE_PRIVATE_KEY }}
          permission-contents: write # Required to commit the patch to the pull request's branch

      # The artifact name is a literal, not the format job's output: that job ran the pull
      # request's code. If docs.yml committed first, the branch has moved past the commit the
      # patch was made from, and commit-patch skips it with `outcome: branch_moved`; the new
      # head starts a new run, which formats again.
      - name: Commit Format
        uses: TimSchoenle/actions/actions/common/commit-patch@bbc2c5e2a0f9345cb2e84946846736f047a6eae3 # tag=actions-common-commit-patch-v1.1.0
        with:
          token: ${{ steps.generate_token.outputs.token }}
          artifact_name: rust-auto-format
          # Rust sources only: the only files `cargo fmt` rewrites. Any other path fails this job.
          allowed_paths: '**/*.rs'
          commit_message: 'style: auto-format rust code'

  # rustdoc, with warnings fatal. `cargo check` never runs the rustdoc lints, so a broken
  # intra-doc link or an unescaped backtick reaches the rendered page and nobody else's job
  # notices. `missing_docs` is in `[workspace.lints.rust]` and fails `check` on its own.
  doc:
    name: Doc
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout the code
    env:
      RUSTDOCFLAGS: '-D warnings'
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      # Once per feature set. `config-schema` gates the `Describe` derives and the generator
      # example, and the module documentation in `discord-alertmanager-config` links items that
      # exist only under it, so a link that breaks with the feature off never shows in the first
      # run.
      - name: Document
        run: cargo doc --workspace --all-features --no-deps

      - name: Document with default features
        run: cargo doc --workspace --no-deps

      - name: Doctests
        run: cargo test --workspace --all-features --doc

  # The declared floor: `rust-version` in `[workspace.package]`, read from Cargo.toml so this job
  # can never check a different version than the one Cargo enforces. Renovate's `rust toolchain`
  # group (the shared `rust-application` preset) moves it together with `rust-toolchain.toml`.
  #
  # `RUSTUP_TOOLCHAIN` rather than the action's `toolchain` input alone: `rust-toolchain.toml`
  # sits in the working directory and rustup honours it over a default, so without the variable
  # this job would silently use the pinned toolchain and check nothing.
  #
  # No `--all-targets`. The floor is about the crates, and the dev-dependencies (proptest,
  # testcontainers, wiremock) carry MSRVs of their own that nothing depending on this workspace
  # would ever compile.
  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout the code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Resolve the declared MSRV from Cargo.toml
        id: msrv
        run: |
          msrv=$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)
          if ! printf '%s' "$msrv" | grep -Eq '^[0-9]+\.[0-9]+(\.[0-9]+)?$'; then
            echo '::error::no rust-version = "<major>.<minor>[.<patch>]" line in Cargo.toml'
            exit 1
          fi
          echo "version=$msrv" >> "$GITHUB_OUTPUT"
          echo "::notice::MSRV $msrv"

      - name: Install the declared MSRV toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Check
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.version }}
        run: cargo check --workspace --all-features

  # The rule `discord-alertmanager-core` states about itself, asserted rather than trusted. Its
  # crate documentation and `deny.toml` both name this job, and both would be prose without it.
  architecture:
    name: Architecture
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout the code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      # Invoked through `bash` rather than executed: the repository is authored on Windows, where
      # git does not record the executable bit.
      - name: Verify the domain crate's dependency rule
        run: bash .github/scripts/verify-architecture.sh

  # The generated half of the configuration surface, regenerated and diffed. `docs/config.md`,
  # `docs/config.json`, `docs/config.contract.json` and `config.example.toml` all come out of the
  # types in `discord-alertmanager-config`, and a key added without them is a key an operator
  # cannot find.
  config-docs:
    name: Config Docs
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout the code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      # `db-prepare` is the other half of `xtask`, and `query-cache` runs it: it needs a container
      # runtime and a database, which this job does not.
      - name: Regenerate
        run: cargo xtask config-docs

      - name: Fail if anything moved
        run: |
          set -euo pipefail
          if ! git diff --exit-code --stat; then
            echo "::error::A generated file is stale. Run 'cargo xtask config-docs' and commit the result."
            git --no-pager diff
            exit 1
          fi

  # The checked queries' half of the generated surface. Every statement in both backends is
  # verified at compile time against its crate's committed `.sqlx/` cache, which is only as good
  # as its agreement with the migrations. This job starts PostgreSQL in Docker and a scratch SQLite
  # file, applies each backend's migrations, and has `sqlx prepare --check` recompile every query
  # against the live schema; a migration or a query changed without regenerating the cache fails
  # here rather than in an ordinary build that would trust the stale cache.
  query-cache:
    name: Query Cache
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # Required to checkout the code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      # Pinned to the `sqlx` the workspace locks, and built with only the two drivers and the
      # `sqlx.toml` support each backend's per-crate database variable needs.
      - name: Install sqlx-cli
        run: >-
          cargo install sqlx-cli --version 0.9.0 --locked --no-default-features
          --features postgres,sqlite,rustls,sqlx-toml

      - name: Verify the offline caches against migrated databases
        run: cargo xtask db-prepare --check

  # The reverse gate on the config contract: regenerate the committed document and the
  # Dockerfile's `LABEL` block from the Rust types and fail if either has drifted. A renamed key
  # or a renamed prefix then shows up in the pull request that renamed it, as a diff a reviewer
  # reads, one step earlier than the label check on the built image, and far cheaper.
  #
  # It overlaps `config-docs` on `docs/config.contract.json` by design. That job proves the
  # committed document matches the generator; this one proves the Dockerfile's labels match the
  # same generator, and a `LABEL` key cannot be interpolated from anything.
  config-contract:
    name: Config Contract
    runs-on: ubuntu-latest
    permissions:
      contents: read # Required to checkout the code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The action checks out nothing and installs nothing — it runs after a build, where a fresh
      # checkout would discard what the build produced — so the toolchain is this job's business.
      - name: Install pinned toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      # `image` is empty, so the two checks needing one are skipped and this job stays the
      # cheap half.
      - name: Check the committed contract and the Dockerfile LABEL region
        uses: TimSchoenle/actions/actions/rust/config-contract@ea4465fbe2bec98efad19b63849f8d1ac67b5c88 # tag=actions-rust-config-contract-v1.4.0
        with:
          example: config-schema
          package: discord-alertmanager-config
          features: config-schema
          contract: docs/config.contract.json
          image: ''

  docker-build-test:
    name: Docker Build and Test (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-docker-${{ matrix.arch }}
      cancel-in-progress: true
    permissions:
      contents: read # Required to checkout the code
      security-events: write # Required to upload Trivy scan results
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Each architecture builds on a runner of its own architecture, so no QEMU
      # emulation layer is involved.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      # Every build reads the layer cache of its architecture; only a push to `main` writes it.
      #
      # A pull request's export lands in a scope of its own, which `main` never reads, but it
      # counts against the repository's 10 GB Actions cache all the same. Each one that rebuilt
      # the cook layer added a compiled dependency tree per architecture, and GitHub made room by
      # evicting the least recently used entries, `main`'s among them: a re-run of an unchanged
      # `main` commit found its cache index naming blobs that were gone (`blob … not found`) and
      # compiled every dependency again. Writing only from `main` keeps the one cache every pull
      # request starts from. The cost is that a pull request changing the lockfile or the build
      # stages cooks again on each of its pushes.
      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: false
          load: true
          tags: discord-alertmanager:test
          build-args: |
            version=test
            release=test
            vendor=Tim Schönle
            VERSION=test
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: ${{ github.event_name == 'push' && format('type=gha,mode=max,scope={0}', matrix.arch) || '' }}

      # Exported from the same build graph the image came from, so the generator is not run a
      # second time at a second moment and the labels cannot describe a different document than
      # the one in the image. `VERSION` matches the image build's, because it reaches the
      # document's `app.version` field and the two copies are compared below.
      #
      # The same cache as the step above, read and not written. The image build takes cached
      # layers lazily: a layer it only needed to reference is never pulled onto the runner. A
      # plain `docker buildx build` here had no cache source, so on a cached run it found none of
      # the contract stage locally and rebuilt it, toolchain and dependencies included, which
      # took 43 to 82 seconds and once failed the job on a download the image build never made.
      - name: Export the config contract
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          target: contract-export
          outputs: type=local,dest=./contract-out
          build-args: |
            VERSION=test
          cache-from: type=gha,scope=${{ matrix.arch }}

      # The image, never the Dockerfile. A source diff cannot see a base image that overrode a
      # label, a `LABEL` line deleted on a branch nobody diffed, or a build argument that
      # silently failed to interpolate.
      #
      # The toolchain is here rather than at the top of the job because only this step needs
      # it, and `cache: false` because this job also builds an image: a restored cache is
      # writable by any branch, and caching in a job that produces a runtime artefact is the
      # cache-poisoning path zizmor flags. Only the generator is compiled, so there is nearly
      # nothing to save.
      - name: Install pinned toolchain
        uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0
        with:
          cache: false

      # `contract` is empty. The committed document is the `config-contract` job's business, and
      # checking it again from a runner that has just spent ten minutes building an image buys
      # nothing. What is left is the image half: the labels, and that the path they advertise has
      # a contract behind it.
      - name: Verify the image carries the contract labels
        id: contract
        uses: TimSchoenle/actions/actions/rust/config-contract@ea4465fbe2bec98efad19b63849f8d1ac67b5c88 # tag=actions-rust-config-contract-v1.4.0
        with:
          example: config-schema
          package: discord-alertmanager-config
          features: config-schema
          contract: ''
          image: discord-alertmanager:test

      # The cross-check the dropped `sha256` label would have bought. The build is the one place
      # that holds both copies, so it costs nothing here and is invisible everywhere else. A
      # stale in-image copy is exactly the failure nothing downstream can see.
      #
      # The path comes from the label rather than from a literal, which ties the two together: a
      # `COPY` that lands the document somewhere the label does not name fails right here. A
      # `FROM scratch` image has no shell, and `docker cp` does not need one.
      - name: Verify the in-image contract is the document that was exported
        env:
          # The label set the step above rendered, as JSON. Read through the environment
          # rather than interpolated into the script, which would be a shell injection
          # wearing a template's clothes.
          LABELS: ${{ steps.contract.outputs.labels }}
        run: |
          set -euo pipefail
          contract_path="$(printf '%s' "${LABELS}" | jq -r '.["dev.terrace.config.contract.path"]')"
          probe="$(docker create discord-alertmanager:test)"
          docker cp "${probe}:${contract_path}" ./from-image.json
          docker rm "${probe}" > /dev/null
          cmp ./from-image.json ./contract-out/contract.json

      # `FROM scratch` has no shell, so the binary is the only thing in the image that can run,
      # and it exits non-zero here because nothing supplied a Discord token or a writable
      # database. Reaching that error is the assertion: the musl binary loaded, found its
      # certificate bundle and installed logging before it complained. A UPX stub that cannot
      # start on the runner's kernel prints nothing at all, which is the arm64 failure the
      # Dockerfile turns UPX off for and the one this step is here to catch.
      - name: Test Docker image runs
        run: |
          set -euo pipefail
          output="$(docker run --rm discord-alertmanager:test 2>&1 || true)"
          printf '%s\n' "${output}"
          printf '%s' "${output}" | grep -q 'starting version='

      # Size against the 150 MiB warning, a Trivy scan at CRITICAL,HIGH and the SARIF upload, in
      # one step. `sarif-category` is the category the inline scan used, so the alerts already in
      # the security dashboard stay attached to it rather than being orphaned under the action's
      # `trivy-linux-<arch>` default; it still differs per architecture, which keeps the two legs
      # from overwriting each other's results. `comment: summary` because a leg can only own its
      # own comment: each one uploads a fragment, and `image-size-report` below posts one table.
      - name: Check Docker image
        uses: TimSchoenle/actions/actions/docker/image-check@9d5cb31939ace7a3d3d7f452052724337c65f153 # tag=actions-docker-image-check-v1.1.8
        with:
          image: discord-alertmanager:test
          platform: ${{ matrix.platform }}
          sarif-category: trivy-${{ matrix.arch }}
          comment: summary

  # One comment for both architectures, built from the fragments the `docker-build-test` legs
  # upload. `always()` so a failed leg costs the table its own row and not the other one. Reporting
  # only: it gates nothing, and a pull request without a table is still a mergeable one.
  image-size-report:
    name: Image Size Report
    runs-on: ubuntu-latest
    needs: docker-build-test
    if: always() && github.event_name == 'pull_request'
    permissions:
      contents: read # Required by docker/image-check-summary
      pull-requests: write # Required to comment on PRs with image size
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Comment image size on PR
        uses: TimSchoenle/actions/actions/docker/image-check-summary@8da2713994ba2b5f542e7e3334db287b1e22854a # tag=actions-docker-image-check-summary-v1.1.6

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    needs: check
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-dependency-review
      cancel-in-progress: true
    if: github.event_name == 'pull_request'
    permissions:
      contents: read # Required to checkout the code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
