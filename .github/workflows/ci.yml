name: Dagger

# Proof of concept: the `test` and image halves of build.yaml, run through the Dagger module in
# `dagger/` instead of through cargo on the runner and `docker buildx`. It runs alongside
# build.yaml on the same events so the two can be compared run for run; it gates nothing and
# publishes nothing.
#
# Every run starts a fresh Dagger engine. Only cargo's caches cross from one run to the next: the
# module packs them into one archive (`cache-archive`), `actions/cache` carries it, and the next
# run unpacks it into the new engine (`cache-restore`) before building. Base images are pulled
# again each time, which is cheaper than carrying them. `.github/scripts/dagger-cache.sh` times
# each phase and writes the result, with the archive size, to the job summary.

on:
  push:
    branches: [ "main" ]

  pull_request:
    branches: [ "main" ]

  workflow_dispatch:

permissions: { }

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: Dagger Pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read # Required to checkout the code
    env:
      # The CLI provisions an engine of the same release; `engineVersion` in dagger.json names it
      # too. Bump both together.
      DAGGER_VERSION: '0.21.10'
      DAGGER_NO_NAG: '1'
      # The archive is not saved above this, so one entry cannot crowd out the rest of the
      # repository's 10 GB cache, which build.yaml's buildx cache also lives in.
      CACHE_ARCHIVE_LIMIT_BYTES: '3221225472'
      METRICS: .github/scripts/dagger-cache.sh
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # RUNNER_TEMP is not visible to the workflow-level `env`, so the path is computed once here.
      - name: Prepare
        id: paths
        run: |
          set -euo pipefail
          echo "archive=${RUNNER_TEMP}/cargo-cache.tar.zst" >> "${GITHUB_OUTPUT}"
          bash "${METRICS}" mark begin

      # The key ends in the run, so every saved archive is a new entry and the newest one with the
      # same lockfile and toolchain is restored. Failing that, the newest one at all: a dependency
      # bump still finds every unchanged crate compiled.
      - name: Restore cargo cache archive
        id: restore
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ steps.paths.outputs.archive }}
          key: dagger-cargo-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            dagger-cargo-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}-
            dagger-cargo-v2-${{ runner.os }}-${{ runner.arch }}-

      # Installs the CLI only: no `call`, `args` or `verb` is given, so the action runs nothing.
      - name: Install Dagger CLI
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: ${{ env.DAGGER_VERSION }}

      # The first call provisions the engine, so this phase is engine start plus module load.
      - name: Load module
        id: module
        run: |
          set -euo pipefail
          bash "${METRICS}" mark cache-download-and-cli
          dagger functions --progress=plain
          bash "${METRICS}" mark engine-and-module

      - name: Restore cargo caches into the engine
        if: ${{ steps.restore.outputs.cache-matched-key != '' }}
        env:
          ARCHIVE: ${{ steps.paths.outputs.archive }}
        run: |
          set -euo pipefail
          bash "${METRICS}" size restored-archive "${ARCHIVE}"
          dagger call --progress=plain cache-restore --archive="${ARCHIVE}"
          rm -f "${ARCHIVE}"
          bash "${METRICS}" mark cache-restore

      - name: Test
        run: |
          set -euo pipefail
          dagger call --progress=plain test
          bash "${METRICS}" mark test

      # The image as a tarball: the same artefact `publish` would push, without a registry.
      - name: Build image
        run: |
          set -euo pipefail
          dagger call --progress=plain docker --app-version=test --release=test \
            export --path="${RUNNER_TEMP}/image.tar"
          bash "${METRICS}" mark docker
          bash "${METRICS}" size image-tarball "${RUNNER_TEMP}/image.tar"

      - name: Smoke test image
        run: |
          set -euo pipefail
          dagger call --progress=plain smoke-test
          bash "${METRICS}" mark smoke-test

      # Whenever the module loaded, so a failed test still saves the dependency builds it made.
      # Saved on pushes to `main` and on pull requests from this repository. A pull request's
      # entry is readable only by that pull request, so `main` never restores what a branch
      # built. Fork pull requests have a read-only cache token and are skipped.
      - name: Archive cargo caches
        id: archive
        if: >-
          ${{ !cancelled() && steps.module.outcome == 'success' && (github.event_name == 'push' ||
          (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)) }}
        env:
          ARCHIVE: ${{ steps.paths.outputs.archive }}
        run: |
          set -euo pipefail
          bash "${METRICS}" mark before-archive
          dagger call --progress=plain cache-archive export --path="${ARCHIVE}"
          bash "${METRICS}" mark cache-archive
          bash "${METRICS}" guard "${ARCHIVE}" "${CACHE_ARCHIVE_LIMIT_BYTES}"

      - name: Save cargo cache archive
        if: ${{ !cancelled() && steps.archive.outputs.save == 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ steps.paths.outputs.archive }}
          # The key the restore step computed, so the two cannot disagree.
          key: ${{ steps.restore.outputs.cache-primary-key }}

      - name: Report
        if: ${{ always() }}
        run: |
          set -euo pipefail
          bash "${METRICS}" mark cache-save
          bash "${METRICS}" report
