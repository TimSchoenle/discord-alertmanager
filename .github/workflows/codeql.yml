name: CodeQL

# Advanced setup in place of CodeQL default setup. Default setup reads exclusions only from the
# `github-codeql-config-file` repository property, which a personal-account repository cannot
# set, so test fixtures and assertion messages raised alerts as if they were production code.
# The shared action runs with `build-mode: none` and excludes the standard test locations; its
# README lists them.

on:
  push:
    branches: [ 'main' ]
  pull_request:
    branches: [ '**' ]
  schedule:
    # Off the hour: GitHub queues the most scheduled runs at the top of the hour and drops some.
    - cron: '23 6 * * 1'

# The event is part of the group: a scheduled run and a push to the default branch share its ref,
# so without it a merge cancelled the weekly analysis.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions: { }

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # to fetch code
      security-events: write # to upload SARIF results
    strategy:
      fail-fast: false
      matrix:
        language: [ actions, rust ]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run CodeQL
        uses: TimSchoenle/actions/actions/security/codeql@7c1147cf1e275c068a8484fa9a2dcb38a8b1f92f # tag=actions-security-codeql-v1.1.10
        with:
          language: ${{ matrix.language }}
