name: CodeQL

# Advanced setup in place of CodeQL default setup. Default setup reads exclusions only from the
# `github-codeql-config-file` repository property, which a personal-account repository cannot
# set, so test fixtures and assertion messages raised alerts as if they were production code.
# The shared action runs with `build-mode: none` and excludes the standard test locations; its
# README lists them.

on:
  push:
    branches: [ 'main' ]
  pull_request:
    branches: [ '**' ]
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: { }

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      contents: read # to fetch code
      security-events: write # to upload SARIF results
    strategy:
      fail-fast: false
      matrix:
        language: [ actions, rust ]
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run CodeQL
        uses: TimSchoenle/actions/actions/security/codeql@9d5cb31939ace7a3d3d7f452052724337c65f153 # tag=actions-security-codeql-v1.1.5
        with:
          language: ${{ matrix.language }}
