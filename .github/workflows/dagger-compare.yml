name: Dagger Comparison

# Temporary. Builds the same image as `build.yaml`'s `docker-build-test` job through the Dagger
# module in `dagger/`, on the same events and runners, so the two can be timed against each other
# cold and warm. It runs no image checks and gates nothing; whichever setup loses the comparison
# is removed along with this file.

on:
  push:
    branches: [ "main" ]

  pull_request:
    branches: [ "main" ]

permissions: { }

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dagger-image:
    name: Dagger Image Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}-${{ matrix.arch }}
      cancel-in-progress: true
    permissions:
      contents: read # Required to checkout the code
    env:
      # The CLI provisions an engine of the same release. `engineVersion` in dagger.json names it
      # too, and Renovate moves both in one pull request.
      # renovate: datasource=github-releases depName=dagger/dagger extractVersion=^v(?<version>.+)$
      DAGGER_VERSION: '0.21.10'
      DAGGER_NO_NAG: '1'
      # One entry per architecture and lockfile. Above this it is not saved, so it cannot crowd
      # the rest of the repository's 10 GB cache quota out.
      CACHE_ARCHIVE_LIMIT_BYTES: '2147483648'
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # The prefix names one architecture, lockfile and toolchain. Every saved archive gets a key
      # of its own under it, because cache keys are immutable.
      - name: Compute cargo cache key
        id: cache-key
        env:
          ARCH: ${{ matrix.arch }}
          LOCK_HASH: ${{ hashFiles('Cargo.lock', 'rust-toolchain.toml') }}
        run: |
          set -euo pipefail
          {
            echo "prefix=dagger-cargo-v3-${ARCH}-${LOCK_HASH}-"
            echo "fallback=dagger-cargo-v3-${ARCH}-"
            echo "archive=${RUNNER_TEMP}/cargo-cache.tar.zst"
          } >> "${GITHUB_OUTPUT}"

      # The newest archive for this lockfile and toolchain, or else the newest at all: a
      # dependency bump still finds every unchanged crate compiled. A pull request reads its own
      # entries and those of `main`; `main` never reads a branch's.
      - name: Restore cargo cache archive
        id: restore
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ steps.cache-key.outputs.archive }}
          key: ${{ steps.cache-key.outputs.prefix }}${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ steps.cache-key.outputs.prefix }}
            ${{ steps.cache-key.outputs.fallback }}

      # Installs the CLI only: no `call`, `args` or `verb` is given, so the action runs nothing.
      - name: Install Dagger CLI
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: ${{ env.DAGGER_VERSION }}

      # The cache only saves time, so a restore that fails (a truncated archive, a layout the
      # module no longer reads) falls back to a cold build instead of failing the job, and the
      # archive step below then replaces the entry rather than leaving it to fail every run.
      - name: Restore cargo caches into the engine
        id: engine-restore
        if: ${{ steps.restore.outputs.cache-matched-key != '' }}
        continue-on-error: true
        env:
          ARCHIVE: ${{ steps.cache-key.outputs.archive }}
        run: |
          set -euo pipefail
          trap 'rm -f "${ARCHIVE}"' EXIT
          dagger call --progress=plain cache-restore --archive="${ARCHIVE}"

      # Each architecture builds on a runner of its own architecture, so no emulation is
      # involved; `--platform` makes a mismatch fail rather than fall back to it silently.
      # `export-image` loads the result into the runner's Docker daemon under the tag the checks
      # below read.
      - name: Build Docker image
        id: build
        env:
          PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          dagger call --progress=plain docker \
            --platform="${PLATFORM}" --app-version=test --release=test \
            export-image --name=discord-alertmanager:test

      # Saved only when nothing usable for this lockfile and toolchain was restored: dependencies
      # are what the archive is for, and the workspace crates are rebuilt every time regardless.
      # That is one entry per dependency change and scope rather than one per push. Runs after a
      # failed check too, so the dependency builds are not lost with it. Fork pull requests have a
      # read-only cache token and are skipped.
      - name: Archive cargo caches
        id: archive
        if: >-
          ${{ !cancelled() && steps.build.outcome == 'success'
          && (!startsWith(steps.restore.outputs.cache-matched-key, steps.cache-key.outputs.prefix)
              || steps.engine-restore.outcome == 'failure')
          && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository) }}
        env:
          ARCHIVE: ${{ steps.cache-key.outputs.archive }}
        run: |
          set -euo pipefail
          dagger call --progress=plain cache-archive export --path="${ARCHIVE}"
          bash .github/scripts/dagger-cache.sh guard "${ARCHIVE}" "${CACHE_ARCHIVE_LIMIT_BYTES}"

      - name: Save cargo cache archive
        if: ${{ !cancelled() && steps.archive.outputs.save == 'true' }}
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: ${{ steps.cache-key.outputs.archive }}
          key: ${{ steps.restore.outputs.cache-primary-key }}
