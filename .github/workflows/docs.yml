name: docs

# `README.md` is generated from `.github/templates/README.md.hbs`. On a pull request, the `render`
# job in generate.yaml renders it, together with the configuration reference it lifts tables from,
# and generate-commit.yaml commits the result to the branch.
#
# This workflow is the other direction. On every event, including a push to `main` and a pull
# request from a fork, the `readme` job renders in `check` mode: nothing is written, and a stale
# `README.md` fails the job. Without that, editing `README.md` directly would appear to work right
# up until the next pull request silently reverted it.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  check:
    name: readme
    # Runs on every event, so the check a branch protection rule requires always reports. On a pull
    # request from this repository it can fail on the commit generate-commit.yaml is about to
    # replace; the run for the rendered commit is the one that gates the merge.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Generate the README payload fragment
        id: config
        run: |
          set -euo pipefail
          json="$(bash .github/scripts/readme-variables.sh)"
          echo "json=${json}" >> "$GITHUB_OUTPUT"

      - name: Collect the README payload
        id: variables
        uses: TimSchoenle/actions/actions/common/readme-variables@7c1147cf1e275c068a8484fa9a2dcb38a8b1f92f # tag=actions-common-readme-variables-v2.1.4
        with:
          manifest: crates/discord-alertmanager/Cargo.toml
          branch: ${{ github.event.repository.default_branch }}
          extra: ${{ steps.config.outputs.json }}

      # Writes nothing; fails with the first differing line when README.md is stale.
      - name: Verify README.md is current
        uses: TimSchoenle/actions/actions/common/render-template@7c1147cf1e275c068a8484fa9a2dcb38a8b1f92f # tag=actions-common-render-template-v3.0.4
        with:
          template: .github/templates/README.md.hbs
          output: README.md
          variables: ${{ steps.variables.outputs.variables }}
          check: 'true'

      # The budgets PROSE.md and the doc-comment GUIDE.md define as mechanical: banned doc-comment
      # openers across the workspace, and the em-dash and bold-frame counts of each hand-written
      # Markdown document and the rendered README. It runs after a failed render too, so one push
      # reports both.
      - name: Check the prose budgets
        if: ${{ !cancelled() }}
        run: bash .github/scripts/prose-check.sh README.md CONTRIBUTING.md SECURITY.md docs/COMMANDS.md docs/ROUTES.md
