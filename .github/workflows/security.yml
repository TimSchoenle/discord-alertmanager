name: Security

# The two gates that read the supply chain rather than the code: the workflows themselves, and
# the dependency graph.
#
# `pull_request: branches: ['**']` rather than `[ main ]`, because a workflow edit on a branch
# that targets another branch is still a workflow edit, and it is the one class of change whose
# damage is done before anyone reviews it.

on:
  push:
    branches: [ 'main' ]
  pull_request:
    branches: [ '**' ]
  # `cargo deny check advisories` reads a database that moves without this repository changing.
  # A dependency that was clean when it was merged is the normal way an advisory arrives.
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: { }

jobs:
  # jactionlint keeps every actionlint check and has a rule for every zizmor audit. The shared action
  # runs the pedantic profile offline (.github/jactionlint.yaml holds the repository's rule choices),
  # annotates the findings and uploads the SARIF to code scanning under the category jactionlint.
  action-lint:
    name: Action Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # to fetch code
      security-events: write # to upload SARIF results
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run jactionlint
        uses: TimSchoenle/actions/actions/security/jactionlint@e2799424abd778c41e7f6d1547fd402386ef398e # tag=actions-security-jactionlint-v1.1.0

  # `deny.toml` holds four rules and all four are this project's own decisions rather than
  # defaults: the licence allowlist, one TLS stack, `anyhow` confined to the binary and the build
  # tooling, and the git source allowlist that keeps `cargo update` from moving terrace-config
  # across arbitrary commits. None of them is enforced by anything else in the pipeline.
  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # Required to checkout the code
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # `deny.toml` sets `all-features = true` under `[graph]`, so the feature set is stated
      # there rather than here and a local `cargo deny check` sees the same graph this job does.
      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: ''
