[package]
name = "discord-alertmanager-store-sqlite"
description = "SQLite backend: checked queries, migrations, and the BEGIN IMMEDIATE claim."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "dam_store_sqlite"
path = "src/lib.rs"

# One dialect per crate, because `sqlx::query!` resolves its driver from a single DATABASE_URL
# per compilation unit. The split is what lets both dialects be compile-time checked at once, and
# it is why this crate owns its own `.env`, `migrations/` and `.sqlx/`.
[dependencies]
async-trait.workspace = true
chrono.workspace = true
dam-core.workspace = true
dam-store.workspace = true
serde_json.workspace = true
sqlx = { workspace = true, features = ["sqlite"] }
thiserror.workspace = true
tracing.workspace = true

[dev-dependencies]
dam-store = { workspace = true, features = ["conformance"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
