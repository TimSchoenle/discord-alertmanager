# Pinned so every developer, the container build and CI compile with one compiler.
# The floor is `rust-version` in Cargo.toml, which the `msrv` CI job checks with a toolchain of
# that version. Renovate moves the two together; this file is about reproducibility, not the floor.
[toolchain]
channel = "1.99.1"
components = ["rustfmt", "clippy"]
profile = "minimal"
