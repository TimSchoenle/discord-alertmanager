# Pinned so every developer, the container build and CI compile with one compiler.
# The MSRV the crates declare (1.94, inherited from terrace-config) is checked separately by the
# `msrv` CI job against that older toolchain; this file is about reproducibility, not the floor.
[toolchain]
channel = "1.97.1"
components = ["rustfmt", "clippy"]
profile = "minimal"
