[package]
name = "xtask"
description = "Build tooling: regenerates the sqlx offline caches and the configuration reference."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

# Containers belong to this crate, never to a `build.rs`. Starting one from a build script makes
# every build need Docker, breaks cross-compilation and any offline build, and turns a cold CI
# cache into a container pull.
[dependencies]
anyhow.workspace = true
clap.workspace = true
sqlx = { workspace = true, features = ["postgres", "sqlite"] }
testcontainers.workspace = true
testcontainers-modules = { workspace = true, features = ["postgres"] }
tokio = { workspace = true, features = ["macros", "process", "rt-multi-thread"] }

[lints]
workspace = true
